<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121c2e" />
      <stop offset="52%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#1c1810" />
    </linearGradient>
    <linearGradient id="sheen-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71b9ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#71b9ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#f0c978" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="fib-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71b9ff" />
      <stop offset="55%" stop-color="#9ecbff" />
      <stop offset="100%" stop-color="#f0c978" />
    </linearGradient>
    <filter id="fib-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Glass Tile Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg-grad)" stroke="#71b9ff" stroke-opacity="0.5" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#sheen-grad)" />

  <!-- Subtle Golden Ratio Subdivision Geometry -->
  <g transform="translate(6, 6) scale(1.625)">
    <line x1="18" y1="9" x2="18" y2="23.5" stroke="#71b9ff" stroke-opacity="0.26" stroke-width="0.8" stroke-dasharray="1.5 1.5" />
    <line x1="18" y1="18" x2="27" y2="18" stroke="#f0c978" stroke-opacity="0.26" stroke-width="0.8" stroke-dasharray="1.5 1.5" />

    <!-- Fibonacci Logarithmic Golden Spiral -->
    <path
      d="M 4 23 A 14 14 0 0 1 18 9 A 9 9 0 0 1 27 18 A 5.5 5.5 0 0 1 21.5 23.5 A 3.5 3.5 0 0 1 18 20 A 2 2 0 0 1 20 18 A 1.2 1.2 0 0 1 21.2 19.2"
      stroke="url(#fib-grad)"
      stroke-width="2.25"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#fib-glow)"
    />

    <!-- Radiant Golden Singularity Node & Fibonacci Points -->
    <circle cx="21" cy="18.8" r="1.85" fill="#f0c978" filter="url(#fib-glow)" />
    <circle cx="4" cy="23" r="1.45" fill="#71b9ff" />
    <circle cx="18" cy="9" r="1.45" fill="#9ecbff" />
    <circle cx="27" cy="18" r="1.45" fill="#f0c978" />
  </g>
</svg>
